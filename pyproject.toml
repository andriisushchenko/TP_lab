[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl"
version = "0.1.0"
description = "SIPL Language Toolkit: grammar, parser, interpreter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lark>=1.1"]

[project.scripts]
sipl = "sipl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sipl.grammar" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sipl --cov-report=term-missing --cov-fail-under=80"
